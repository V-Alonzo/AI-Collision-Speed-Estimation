name: VelocityEstimationAI
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - plotly
  - umap-learn
  - seaborn
  - pip:
      # Datos y serializacion
      - pandas
      - pyarrow
      - python-dotenv
      - openai
      - pillow
      - pymupdf
      - numpy
      - matplotlib
      - opencv-python
      - huggingface_hub
      - datasets
      - scikit-learn

      # Vision y modelos
      - open-clip-torch
      - ultralytics
      - imagededup
      - curl_cffi

      # Torch
      - torch
      - torchvision
      - torchmetrics
      - lightning
      
